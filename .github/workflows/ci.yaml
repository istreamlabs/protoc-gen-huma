name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  
jobs:
  build:
    runs-on: ubuntu-latest
    name: Build & Test
    steps:
      -
        uses: actions/checkout@v5
      -
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      -
        uses: arduino/setup-protoc@v1
      -
        run: |
          go vet ./...
      -
        run: |
          go test ./...
